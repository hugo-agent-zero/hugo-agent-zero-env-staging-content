name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hugo-agent-zero/hugo-agent-zero-child
          path: site
      - uses: actions/setup-go@v5
        with:
          go-version-file: site/go.mod
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.152.2"
          extended: false
      - name: Use this content commit
        working-directory: site
        env:
          GOPROXY: direct
        run: hugo mod get github.com/hugo-agent-zero/hugoagentzero_com-content@${{ github.sha }}
      - name: Build
        working-directory: site
        run: hugo --baseURL "https://hugo-agent-zero.github.io/hugoagentzero_com-content/"
      # Omit this step if settings.search.pagefind is false / you use another search.
      - name: Index search
        working-directory: site
        run: npx -y pagefind@1.5.2 --site public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
